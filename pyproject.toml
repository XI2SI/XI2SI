[project]
name = "XI2SI"
version = "0.0.1"
description = "X-Intelligence to Super Intelligence."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "XI2SI", email = "hello@xi2si.com"},
]
maintainers = [
    {name = "XI2SI", email = "hello@xi2si.com"},
]
readme = "README.md"
keywords = ["Super Intelligence"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/XI2SI/XI2SI"
Repository = "https://github.com/XI2SI/XI2SI"
Documentation = "https://github.com/XI2SI/XI2SI"
Source = "https://github.com/XI2SI/XI2SI"
Issues = "https://github.com/XI2SI/XI2SI/issues"
Changelog = "https://github.com/XI2SI/XI2SI/releases"

[dependency-groups]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
indent-width = 4
exclude = [".venv"]
extend-exclude = ["tests"]

[tool.ruff.lint]
extend-select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "D",   # pydocstyle (docstring conventions)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "BLE", # flake8-blind-except
]

ignore = [
    "ANN001",  # Missing type annotation of function argument
    "ANN002",  # Missing type annotation for `*args`
    "ANN003",  # Missing type annotation for `**kwargs`
    "ANN201",  # Missing return type of public function
    "ANN202",  # Missing return type of private function
    "ANN204",  # Missing return type annotation for special method `__init__`
    "ANN205",  # Missing return type annotation for staticmethod
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in `__init__`
    "D100",  # Missing docstring in public module
    "D204",  # 1 blank line required after class docstring
    "D417",  # Missing argument description in the docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
ignore_missing_imports = true

[tool.black]
line-length = 120
skip-magic-trailing-comma = true

[tool.isort]
line_length = 120
profile = "black"
include_trailing_comma = true

[tool.pytest]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
